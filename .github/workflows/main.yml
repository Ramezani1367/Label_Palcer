name: ساخت فایل اجرایی ویندوز

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: گرفتن کد
        uses: actions/checkout@v4

      - name: پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: ساخت آیکون
        run: python build_icon.py

      - name: ساخت LabelPlacer.exe
        run: pyinstaller --noconfirm --clean label-placer.spec

      - name: چیدن پوشه ماژولار
        run: python assemble_modular.py

      - name: فشرده‌سازی
        shell: pwsh
        run: Compress-Archive -Path dist\LabelPlacer -DestinationPath LabelPlacer-Windows.zip -Force

      - name: بارگذاری خروجی
        uses: actions/upload-artifact@v4
        with:
          name: LabelPlacer-Windows
          path: LabelPlacer-Windows.zip
          if-no-files-found: error
